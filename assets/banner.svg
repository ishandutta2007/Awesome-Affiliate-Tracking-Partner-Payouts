<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050b14" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.25" />
    </pattern>

    <style>
      .pulse-slow {
        animation: pulseSlow 8s ease-in-out infinite alternate;
      }
      .pulse-fast {
        animation: pulseFast 5s ease-in-out infinite alternate;
      }
      .float-card-1 {
        animation: floatCard1 6s ease-in-out infinite alternate;
      }
      .float-card-2 {
        animation: floatCard2 7s ease-in-out infinite alternate;
      }
      .float-card-3 {
        animation: floatCard3 6.5s ease-in-out infinite alternate;
      }
      .flow-path {
        stroke-dasharray: 8 12;
        animation: dashMove 20s linear infinite;
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -400; }
      }
      @keyframes pulseSlow {
        0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        100% { transform: scale(1.18) translate(30px, -20px); opacity: 0.65; }
      }
      @keyframes pulseFast {
        0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
        100% { transform: scale(1.25) translate(-25px, 20px); opacity: 0.55; }
      }
      @keyframes floatCard1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatCard2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes floatCard3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Background Animated Luminous Orbs -->
  <g class="pulse-slow" filter="url(#glowCyan)">
    <circle cx="200" cy="110" r="140" fill="#0284c7" opacity="0.45" />
  </g>
  <g class="pulse-fast" filter="url(#glowPurple)">
    <circle cx="1020" cy="290" r="160" fill="#7c3aed" opacity="0.4" />
    <circle cx="880" cy="90" r="100" fill="#ec4899" opacity="0.25" />
  </g>

  <!-- Cyber Grid Pattern Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Connecting Network Circuit (Background Flow) -->
  <g opacity="0.35">
    <path class="flow-path" d="M 60,330 C 260,330 320,380 500,380 C 680,380 720,320 900,320 C 1050,320 1100,370 1150,370" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-path" d="M 60,90 C 220,90 280,40 450,40 C 620,40 680,90 850,90 C 1020,90 1080,40 1150,40" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Top Category Indicator Pill -->
  <g transform="translate(425, 42)">
    <rect width="350" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="16" r="5" fill="#10b981" />
    <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">CURATED AWESOME KNOWLEDGE HUB</text>
  </g>

  <!-- Foreground Title (Guaranteed Unhidden & Center Stage) -->
  <g id="title-group">
    <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
      Affiliate Tracking &amp; Partner Payouts
    </text>
    <!-- Subtitle & Value Proposition -->
    <text x="600" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      Attribution Engines • Fraud Detection • Double-Entry Ledgers • Open-Source &amp; SaaS
    </text>
  </g>

  <!-- Interactive / Dynamic Feature Showcase Cards (Lower Foreground Deck) -->
  <g transform="translate(60, 215)">
    <!-- Card 1: Click & Conversion Attribution -->
    <g class="float-card-1" transform="translate(0, 0)">
      <rect width="320" height="150" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="20" y="22" width="40" height="40" rx="10" fill="url(#accentCyan)" opacity="0.9" />
      <text x="33" y="48" font-size="20">⚡</text>
      <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Click Attribution</text>
      <text x="74" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#38bdf8">S2S Postbacks &amp; Webhooks</text>
      <text x="22" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#94a3b8">
        • First-party tracking cookies &amp; tokens
      </text>
      <text x="22" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#94a3b8">
        • Stripe, Paddle, Chargebee sync
      </text>
      <text x="22" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#94a3b8">
        • Dynamic UTM &amp; coupon mapping
      </text>
    </g>

    <!-- Card 2: Commission Engines & Fraud Detection -->
    <g class="float-card-2" transform="translate(380, 0)">
      <rect width="320" height="150" rx="16" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" />
      <rect x="20" y="22" width="40" height="40" rx="10" fill="url(#accentPurple)" opacity="0.9" />
      <text x="33" y="48" font-size="20">🛡️</text>
      <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Fraud &amp; Ledgers</text>
      <text x="74" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#c084fc">Auditable Double-Entry</text>
      <text x="22" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#94a3b8">
        • 13+ anti-fraud heuristics &amp; IP rules
      </text>
      <text x="22" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#94a3b8">
        • Transparent partner balance math
      </text>
      <text x="22" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#94a3b8">
        • Automated refund &amp; dispute clawbacks
      </text>
    </g>

    <!-- Card 3: Batch Payouts & Self-Hosted Freedom -->
    <g class="float-card-3" transform="translate(760, 0)">
      <rect width="320" height="150" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="20" y="22" width="40" height="40" rx="10" fill="url(#goldGrad)" opacity="0.9" />
      <text x="33" y="48" font-size="20">💸</text>
      <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Automated Payouts</text>
      <text x="74" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#fbbf24">Zero Vendor Lock-in</text>
      <text x="22" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#94a3b8">
        • PayPal &amp; Wise batch payout CSVs
      </text>
      <text x="22" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#94a3b8">
        • Go, PHP, Cloudflare Edge &amp; Docker
      </text>
      <text x="22" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#94a3b8">
        • AI-native management via MCP servers
      </text>
    </g>
  </g>

  <!-- Clean Bottom Accent Border -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#titleGrad)" />
</svg>
